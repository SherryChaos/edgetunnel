name: cf-deploy

on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
      - 'wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker (Workers API, BOM-safe)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          # deploy-trigger-api
          ACC=fb2e41efee1bb409a132accf543017dd
          KV=33e54e3f2ded478f973c50b99ff2a4e8

          # 仓库里的 _worker.js 带 UTF-8 BOM，必须去掉，否则模块运行时会抛异常（1101）
          python3 - <<'PY'
          import io
          p = '_worker.js'
          data = open(p, 'rb').read()
          if data.startswith(b'\xef\xbb\xbf'):
              data = data[3:]
              open(p, 'wb').write(data)
              print('BOM stripped')
          else:
              print('no BOM')
          PY

          META=$(jq -n --arg a "$ADMIN" --arg kv "$KV" \
            '{main_module:"_worker.js",compatibility_date:"2025-09-01",bindings:[{type:"kv_namespace",name:"KV",namespace_id:$kv},{type:"plain_text",name:"ADMIN",text:$a}]}')

          curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/edgetunnel" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F "metadata=$META" \
            -F "_worker.js=@_worker.js;type=application/javascript+module" \
            -o /tmp/out.json

          jq -e '.success == true' /tmp/out.json
          jq -r '.result.modified_on' /tmp/out.json
